name: Windows package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-lock.txt
          python -m pip install -r packaging/windows/requirements-build.txt pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements-lock.txt

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Install and audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build and verify Windows package
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -PythonExe (Get-Command python).Source `
            -OutputZip "$env:RUNNER_TEMP\TheraSim-v0.2.0-windows-x64.zip"
          ./scripts/verify-windows-package.ps1 `
            -PackageZip "$env:RUNNER_TEMP\TheraSim-v0.2.0-windows-x64.zip"
          Get-FileHash "$env:RUNNER_TEMP\TheraSim-v0.2.0-windows-x64.zip" -Algorithm SHA256

      - name: Upload verified build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: TheraSim-v0.2.0-windows-x64
          path: |
            ${{ runner.temp }}/TheraSim-v0.2.0-windows-x64.zip
            ${{ runner.temp }}/TheraSim-v0.2.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
